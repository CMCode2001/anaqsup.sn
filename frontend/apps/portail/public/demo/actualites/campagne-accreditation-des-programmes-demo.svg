      <rect x="0" y="80" width="300" height="380" rx="26" fill="#C7B62E" fill-opacity=".14"/>
      <path d="M50 170 H250" stroke-linecap="round" stroke-opacity=".9"/><path d="M50 230 H190" stroke-linecap="round" stroke-opacity=".9"/><path d="M50 290 H250" stroke-linecap="round" stroke-opacity=".9"/><path d="M50 350 H190" stroke-linecap="round" stroke-opacity=".9"/>
