    </linearGradient>
    <radialGradient id="glow"><stop offset="0" stop-color="#C7B62E" stop-opacity=".55"/><stop offset="1" stop-color="#C7B62E" stop-opacity="0"/></radialGradient>
    <radialGradient id="glow2"><stop offset="0" stop-color="#109939" stop-opacity=".28"/><stop offset="1" stop-color="#109939" stop-opacity="0"/></radialGradient>
