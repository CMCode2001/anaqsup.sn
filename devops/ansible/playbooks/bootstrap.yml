# Provisionnement d'une VM Ubuntu 24.04 LTS pour la pile ANAQ-Sup (idempotent).
#   ansible-playbook -i inventories/staging.ini playbooks/bootstrap.yml
- name: Socle serveur ANAQ-Sup
  hosts: anaqsup
  become: true
  vars:
    base_dir: /opt/anaqsup
    deploy_user: deploy

  handlers:
    - name: Redémarrer SSH
      ansible.builtin.service:
        name: ssh
        state: restarted
    - name: Redémarrer Docker
      ansible.builtin.service:
        name: docker
        state: restarted

  tasks:
    - name: Paquets de base et mises à jour de sécurité automatiques
      ansible.builtin.apt:
        name: [ca-certificates, curl, gnupg, ufw, fail2ban, unattended-upgrades, rclone, jq]
        state: present
        update_cache: true

    - name: Dépôt APT officiel Docker (clé)
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: "0644"

    - name: Dépôt APT officiel Docker (source)
      ansible.builtin.apt_repository:
        repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
        filename: docker

    - name: Docker Engine + plugin Compose
      ansible.builtin.apt:
        name: [docker-ce, docker-ce-cli, containerd.io, docker-buildx-plugin, docker-compose-plugin]
        state: present
        update_cache: true

    - name: Démon Docker — rotation des journaux, redémarrage à chaud
      ansible.builtin.copy:
        dest: /etc/docker/daemon.json
        mode: "0644"
        content: |
          {
            "log-driver": "json-file",
            "log-opts": { "max-size": "20m", "max-file": "5" },
            "live-restore": true,
            "no-new-privileges": true
          }
      notify: Redémarrer Docker

    - name: Utilisateur de déploiement (membre du groupe docker = privilèges élevés, accès par clé uniquement)
      ansible.builtin.user:
        name: "{{ deploy_user }}"
        groups: [docker]
        append: true
        shell: /bin/bash

    - name: Clés SSH autorisées pour {{ deploy_user }}
      ansible.posix.authorized_key:
        user: "{{ deploy_user }}"
        key: "{{ deploy_authorized_keys | join('\n') }}"
        exclusive: true

    - name: Durcissement SSH
      ansible.builtin.copy:
        dest: /etc/ssh/sshd_config.d/10-anaqsup.conf
        mode: "0644"
        content: |
          PasswordAuthentication no
          KbdInteractiveAuthentication no
          PermitRootLogin no
          MaxAuthTries 3
          AllowUsers {{ deploy_user }} {{ ansible_user }}
        validate: /usr/sbin/sshd -t -f %s
      notify: Redémarrer SSH

    - name: Pare-feu — politique par défaut
      community.general.ufw:
        default: deny
        direction: incoming

    - name: Pare-feu — SSH limité, HTTP(S) ouverts
      community.general.ufw:
        rule: "{{ item.rule }}"
        port: "{{ item.port }}"
        proto: tcp
      loop:
        - { rule: limit, port: "22" }
        - { rule: allow, port: "80" }
        - { rule: allow, port: "443" }

    - name: Pare-feu — activation
      community.general.ufw:
        state: enabled

    - name: Arborescence /opt/anaqsup
      ansible.builtin.file:
        path: "{{ base_dir }}/{{ item.path }}"
        state: directory
        owner: "{{ deploy_user }}"
        group: "{{ deploy_user }}"
        mode: "{{ item.mode }}"
      loop:
        - { path: "", mode: "0755" }
        - { path: releases, mode: "0755" }
        - { path: shared, mode: "0700" }
        - { path: backups, mode: "0700" }

    - name: Sauvegarde quotidienne (02:30)
      ansible.builtin.cron:
        name: anaqsup-backup
        user: "{{ deploy_user }}"
        minute: "30"
        hour: "2"
        job: "{{ base_dir }}/current/scripts/backup.sh {{ anaqsup_env }} >> {{ base_dir }}/backups/backup.log 2>&1"

    - name: Renouvellement TLS (deux fois par jour)
      ansible.builtin.cron:
        name: anaqsup-tls-renew
        user: "{{ deploy_user }}"
        minute: "17"
        hour: "3,15"
        job: "{{ base_dir }}/current/scripts/tls-renew.sh {{ anaqsup_env }} >> {{ base_dir }}/backups/tls.log 2>&1"
