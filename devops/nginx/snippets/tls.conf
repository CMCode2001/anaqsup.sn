# Certificat unique (SAN) pour tous les hôtes, émis par devops/scripts/tls-issue.sh.
ssl_certificate     /etc/letsencrypt/live/anaqsup/fullchain.pem;
ssl_certificate_key /etc/letsencrypt/live/anaqsup/privkey.pem;

# Profil « intermediate » (Mozilla) : TLS 1.2+ et suites modernes.
ssl_protocols TLSv1.2 TLSv1.3;
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
ssl_prefer_server_ciphers off;
ssl_session_timeout 1d;
ssl_session_cache shared:TLS:10m;
ssl_session_tickets off;
# Pas d'OCSP stapling : Let's Encrypt a retiré OCSP de ses certificats en 2025.
