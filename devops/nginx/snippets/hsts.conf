# HSTS 1 an. N'ajouter `includeSubDomains; preload` qu'après inventaire de TOUS les
# sous-domaines de anaqsup.sn (messagerie, autres applications…) : un sous-domaine sans HTTPS deviendrait inaccessible.
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Robots-Tag $robots_tag always;   # défini par templates/00-globals.conf.template
