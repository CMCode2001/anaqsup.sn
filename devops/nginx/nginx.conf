# Nginx frontal ANAQ-Sup : seul point d'entrée (80/443) de la pile.
# Les server blocks sont générés au démarrage depuis templates/ (envsubst) vers /etc/nginx/sites.
user  nginx;
worker_processes  auto;
pid   /run/nginx.pid;

events {
    worker_connections  2048;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    server_tokens off;
    sendfile      on;
    tcp_nopush    on;
    keepalive_timeout  65;
    client_max_body_size 2m;

    # Journaux JSON : directement exploitables par Loki/ELK.
    log_format json escape=json '{"time":"$time_iso8601","remote":"$remote_addr","host":"$host",'
        '"request":"$request","status":$status,"bytes":$body_bytes_sent,"rt":$request_time,'
        '"upstream_rt":"$upstream_response_time","cache":"$upstream_cache_status","ua":"$http_user_agent"}';
    access_log /var/log/nginx/access.log json;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    # Derrière un CDN, décommenter et lister ses plages d'IP pour retrouver l'IP réelle du client :
    # set_real_ip_from <plage-cdn>;
    # real_ip_header   X-Forwarded-For;

    # Limitation de débit (réponses 429 au format attendu par les clients de l'API).
    limit_req_zone $binary_remote_addr zone=api:10m    rate=20r/s;
    limit_req_zone $binary_remote_addr zone=search:10m rate=5r/s;
    limit_req_zone $binary_remote_addr zone=verify:10m rate=2r/s;
    # Connexion au back-office : freine les essais de mots de passe en série (pas de verrouillage de compte).
    limit_req_zone $binary_remote_addr zone=login:10m  rate=10r/m;
    limit_req_status 429;

    # Cache des lectures publiques de l'API : sert le contenu même si le backend tombe.
    proxy_cache_path /var/cache/nginx/api levels=1:2 keys_zone=api_cache:20m max_size=1g inactive=24h use_temp_path=off;

    # 2 157 URLs historiques WordPress → 301 (fichier généré : devops/scripts/legacy-redirects.py).
    map_hash_bucket_size 256;
    map_hash_max_size    16384;
    map $uri $legacy_redirect {
        default "";
        include /etc/nginx/redirects/legacy-wordpress.map;
    }
    # Pages supprimées volontairement (restes du thème, inscription publique) : 410 Gone.
    map $uri $legacy_gone {
        default 0;
        include /etc/nginx/redirects/legacy-gone.map;
    }

    # Votes « J'aime » des lecteurs (PUT seulement) : freine les robots. La lecture des compteurs (GET) n'est pas
    # limitée : beaucoup de lecteurs partagent la même adresse IP (réseaux universitaires).
    map $request_method $reaction_vote {
        PUT     $binary_remote_addr;
        default "";
    }
    limit_req_zone $reaction_vote zone=reactions:10m rate=20r/m;

    # Résolution DNS Docker dynamique : un conteneur recréé (nouvelle IP) est retrouvé sans reload.
    resolver 127.0.0.11 valid=10s ipv6=off;

    upstream portail    { zone portail 64k;    server portail:3000    resolve; keepalive 16; }
    upstream backend    { zone backend 64k;    server backend:8080    resolve; keepalive 16; }
    upstream backoffice { zone backoffice 64k; server backoffice:8080 resolve; keepalive 8; }

    include /etc/nginx/sites/*.conf;
}
