global:
  scrape_interval: 30s
  evaluation_interval: 30s

scrape_configs:
  # Spring Boot Actuator (port de management, jamais exposé par Nginx).
  - job_name: backend
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["backend:8081"]

  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]
