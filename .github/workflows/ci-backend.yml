name: CI · backend

on:
  pull_request:
    paths: ["backend/**", "contracts/**", ".github/workflows/ci-backend.yml"]
  push:
    branches: [main]
    paths: ["backend/**", "contracts/**", ".github/workflows/ci-backend.yml"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Compilation, tests unitaires, frontières des modules, tests d'intégration (PostgreSQL réel)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      # Testcontainers utilise le Docker du runner pour les tests *IT.
      - run: ./mvnw -B -ntp verify
      - name: Documentation des modules (Spring Modulith)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: modules-docs
          path: backend/target/spring-modulith-docs
          if-no-files-found: ignore
