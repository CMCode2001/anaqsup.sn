# Livraison continue : « build once, deploy many ».
#   push main      → images sha-xxxxxxx → déploiement automatique en RECETTE
#   tag vX.Y.Z     → images vX.Y.Z     → déploiement en PRODUCTION après approbation (environment)
name: Release

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  images:
    name: Image ${{ matrix.image }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: anaqsup-backend
            context: .
            dockerfile: backend/Dockerfile
          - image: anaqsup-portail
            context: frontend
            dockerfile: frontend/apps/portail/Dockerfile
          - image: anaqsup-backoffice
            context: frontend
            dockerfile: frontend/apps/backoffice/Dockerfile
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v7
      - id: version
        run: |
          if [[ $GITHUB_REF == refs/tags/v* ]]; then echo "value=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT";
          else echo "value=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"; fi
      # Nom de l'image : un nom Docker est en minuscules, or le compte GitHub (« CMCode2001 ») en a.
      - id: image
        run: echo "name=ghcr.io/$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')/${{ matrix.image }}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=${{ steps.version.outputs.value }}
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.version.outputs.value }}
          provenance: true
          sbom: true
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
      - name: Scan de l'image (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.name }}:${{ steps.version.outputs.value }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  deploy:
    name: Déploiement ${{ startsWith(github.ref, 'refs/tags/') && 'production' || 'staging' }}
    needs: images
    runs-on: ubuntu-24.04
    # Secrets et règles d'approbation portés par l'environnement GitHub (Settings → Environments).
    environment:
      name: ${{ startsWith(github.ref, 'refs/tags/') && 'production' || 'staging' }}
      url: ${{ vars.PUBLIC_URL }}
    env:
      ENV_NAME: ${{ startsWith(github.ref, 'refs/tags/') && 'production' || 'staging' }}
      VERSION: ${{ needs.images.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - name: Clé SSH (empreinte du serveur épinglée, pas de ssh-keyscan)
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          echo "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
      - name: Dépôt de la release (contenu de devops/, immuable)
        env:
          TARGET: deploy@${{ vars.SSH_HOST }}
        # VERSION est calculée par la CI : l'expansion côté client est voulue (SC2029).
        run: |
          RELEASE_DIR="/opt/anaqsup/releases/$VERSION"
          tar -czf release.tgz -C devops .
          # shellcheck disable=SC2029
          ssh "$TARGET" "mkdir -p '$RELEASE_DIR'"
          scp release.tgz "$TARGET:$RELEASE_DIR/"
          # shellcheck disable=SC2029
          ssh "$TARGET" "cd '$RELEASE_DIR' && tar -xzf release.tgz && rm release.tgz"
      - name: Bascule (healthchecks + retour arrière automatique)
        env:
          TARGET: deploy@${{ vars.SSH_HOST }}
        run: |
          # shellcheck disable=SC2029
          ssh "$TARGET" "/opt/anaqsup/releases/$VERSION/scripts/deploy.sh '$ENV_NAME' '$VERSION'"
      - name: Vérification de bout en bout
        run: |
          curl -fsS --retry 5 --retry-delay 5 "${{ vars.PUBLIC_URL }}/api/health"
          curl -fsS --retry 5 --retry-delay 5 "${{ vars.API_URL }}/openapi/public-api.v1.yaml" -o /dev/null
